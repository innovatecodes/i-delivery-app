version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: i-delivery-postgres
    environment:
      POSTGRES_DB: i_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: i-delivery-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=i_delivery;Username=postgres;Password=postgres"
      Jwt__Secret: "your-super-secret-jwt-key-change-in-production-min-32-chars"
      Jwt__Issuer: "i-delivery"
      Jwt__Audience: "i-delivery-clients"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: