services:
  postgres:
    image: postgres:16-alpine
    container_name: i-delivery-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: ${DOCKER_RESTART_POLICY:-unless-stopped}

  backend:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: i-delivery-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      JwtOptions__Secret: ${JwtOptions__Secret}
      JwtOptions__Issuer: ${JwtOptions__Issuer}
      JwtOptions__Audience: ${JwtOptions__Audience}
      JwtOptions__AccessTokenExpirationMinutes: ${JwtOptions__AccessTokenExpirationMinutes:-30}
      JwtOptions__RefreshTokenExpirationDays: ${JwtOptions__RefreshTokenExpirationDays:-7}
      ClientSettings__BaseUrl: ${ClientSettings__BaseUrl}
      EmailOptions__EnableEmailSending: ${EmailOptions__EnableEmailSending:-false}
      EmailOptions__SmtpHost: ${EmailOptions__SmtpHost}
      EmailOptions__SmtpPort: ${EmailOptions__SmtpPort:-587}
      EmailOptions__SmtpUser: ${EmailOptions__SmtpUser}
      EmailOptions__SmtpPassword: ${EmailOptions__SmtpPassword}
      EmailOptions__UseSsl: ${EmailOptions__UseSsl:-true}
      EmailOptions__FromName: ${EmailOptions__FromName:-iDelivery}
      EmailOptions__FromEmail: ${EmailOptions__FromEmail}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: ${DOCKER_RESTART_POLICY:-unless-stopped}

volumes:
  postgres_data:
